[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlora-jumia"
version = "0.1.0"
description = "Crawlora Jumia API client with 8 endpoints for country and category discovery, product search, and product details"
readme = "README.md"
keywords = ["crawlora", "api-client", "sdk", "web-scraping", "scraping-api", "jumia", "jumia-api", "jumia-scraper", "jumia-data", "jumia-country-category-discovery", "jumia-product-search", "jumia-product-details"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crawlora" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]
dependencies = ["typing-extensions>=4.7; python_version < '3.11'"]

[project.optional-dependencies]
async = ["httpx>=0.27"]
test = ["mypy>=1.11", "pytest>=8"]

[project.urls]
Homepage = "https://crawlora.net/?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=jumia-python-homepage"
Documentation = "https://crawlora.net/docs?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=jumia-python-api-docs"
Repository = "https://github.com/Crawlora-org/crawlora-jumia"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawlora_jumia"]

[tool.setuptools.package-data]
"crawlora_jumia" = ["py.typed", "*.pyi"]
